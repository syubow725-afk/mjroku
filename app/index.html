<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <!-- iPhone の「ホーム画面に追加」で全画面起動させるための指定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻雀録">
  <title>麻雀録</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <h1>麻雀録</h1>
  </header>

  <main>
    <section class="card">
      <h2>起動確認</h2>
      <dl class="kv">
        <dt>表示モード</dt><dd id="display-mode">—</dd>
        <dt>バージョン</dt><dd id="version">—</dd>
        <dt>オフライン対応</dt><dd id="sw-status">—</dd>
      </dl>
    </section>

    <section class="card">
      <h2>GAS 接続テスト</h2>
      <label class="field">
        <span>ウェブアプリ URL</span>
        <input id="gas-url" type="url" inputmode="url" autocomplete="off"
               placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <button id="ping" type="button">保存して接続テスト</button>
      <p id="ping-result" class="result"></p>
    </section>

    <section class="card">
      <h2>合言葉の確認</h2>
      <label class="field">
        <span>合言葉</span>
        <input id="passcode" type="password" autocomplete="off">
      </label>
      <button id="load" type="button">保存して読み込みテスト</button>
      <p id="load-result" class="result"></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
